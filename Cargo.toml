[workspace]
members = [
    "ib-matcher",
    "ib-pinyin",
    "ib-pinyin/bindings/c",
    # "ib-pinyin/bindings/diplomat"
    "ib-romaji",
    "ib-unicode",
]
resolver = "3"

[workspace.package]
authors = ["Chaoses-Ib"]
homepage = "https://github.com/Chaoses-Ib/ib-matcher"
repository = "https://github.com/Chaoses-Ib/ib-matcher"
license = "MIT"

[workspace.dependencies]
ib-pinyin-data = { path = "ib-pinyin-data", version = "0.1", default-features = false }

[profile.release]
lto = "fat"
codegen-units = 1
